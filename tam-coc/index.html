.grab{flex:none;border:0;background:none;width:100%;padding:8px 0 2px;touch-action:none}
.grab::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.head{flex:none;padding:4px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.headrow{display:flex;gap:8px;align-items:center}
.tabs{flex:1;display:flex;gap:2px;background:var(--soft);border-radius:16px;padding:4px;position:relative}
.tabs button{transition:color .15s;flex:1;white-space:nowrap;border:0;background:none;border-radius:12px;padding:8px 4px;font-weight:600;font-size:.88rem;color:var(--muted);position:relative;z-index:1;transition:color var(--d-ui)}
.tabs button[aria-selected="true"]{color:var(--on-primary)}
.tabs .ind{position:absolute;top:4px;bottom:4px;border-radius:12px;background:var(--primary);transition:left var(--d-tab) var(--ease-out),width var(--d-tab) var(--ease-out)}
.tabs .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--copper);color:#fff;font-size:.7rem;margin-left:4px;padding:0 5px}
.close{flex:none;width:40px;height:40px;border-radius:14px;border:0;padding:0;overflow:hidden;background:var(--soft);display:grid;place-items:center;color:var(--ink);transition:width var(--d-sheet) var(--ease-sheet),margin var(--d-sheet) var(--ease-sheet),opacity var(--d-sheet) var(--ease-sheet),transform var(--d-sheet) var(--ease-sheet)}
.close svg{width:16px;height:16px}
.sheet:not(.mid):not(.open) .close{width:0;margin-left:-8px;opacity:0;pointer-events:none;transform:scale(.6)}
.modes{display:flex;gap:6px}
.modes button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px;font-size:.8rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);transition:all var(--d-ui) var(--ease-out)}
.modes svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.modes button[aria-pressed="true"]{border-color:var(--olive);background:var(--tag);color:var(--ink)}

.body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:2px max(14px,env(safe-area-inset-right,0px)) 28px max(14px,env(safe-area-inset-left,0px))}
.body>*{animation:rise var(--d-tab) var(--ease-out)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:all var(--d-ui) var(--ease-out)}
.chip i{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

/* place cards */
.lcards{display:grid;gap:14px}
.lcard{display:block;content-visibility:auto;contain-intrinsic-size:auto 300px;border:0;background:var(--surface);border-radius:var(--r);padding:0;text-align:left;overflow:hidden;box-shadow:0 1px 2px rgba(60,45,35,.06);transition:transform var(--d-ui) var(--ease-out)}
.lcard .img{position:relative;aspect-ratio:16/10;background:var(--soft)}
.nophoto{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:.8rem;background:var(--soft)}
.nophoto svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lcard .img img{width:100%;height:100%;object-fit:cover;display:block}
.lcard .img .tagc{position:absolute;left:12px;top:12px;background:color-mix(in srgb,var(--raised) 88%,transparent);border-radius:999px;padding:4px 10px;font-size:.72rem;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
.lcard .img .tagc i{width:7px;height:7px;border-radius:50%}
.lcard .img .tm{position:absolute;right:12px;top:12px;background:var(--primary);color:var(--on-primary);border-radius:999px;padding:4px 10px;font-size:.76rem;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.lcard .img .tm svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lcard .txt{padding:12px 16px 14px}
.lcard h4{margin:0;font-size:1.08rem;font-weight:700;line-height:1.25;display:flex;align-items:center;gap:6px}
.lcard .vnk{margin-top:2px;font-size:.8rem;font-weight:600;color:var(--copper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard .vnk i{font-style:normal;color:var(--muted);font-weight:500}
.lcard p{margin:3px 0 0;color:var(--muted);font-size:.86rem;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sect{margin:22px 2px 8px;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.mini{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r);overflow:hidden}
.mini li+li{border-top:1px solid var(--line)}
.mini button{width:100%;display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;border:0;background:none;padding:11px 14px;text-align:left}
.mini .mi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.mini .mi svg{width:18px;height:18px;fill:none;stroke:var(--raised);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mini .mt{min-width:0}.mini .mt b{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.95rem}
.mini .mt>span{display:block;font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini a.resto{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;text-decoration:none;color:inherit}
.mini .md small{display:block;font-weight:500;color:var(--muted);font-size:.7rem;margin-left:4px}
.mini .md{display:flex;align-items:center;gap:5px;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.mini .md svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.inplan{width:8px;height:8px;border-radius:50%;background:var(--copper);display:inline-block}
.far{color:var(--muted);font-size:.72rem;font-weight:600;background:var(--soft);border-radius:6px;padding:1px 6px}

/* detail */
.dtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ghost{border:0;background:var(--soft);border-radius:12px;padding:7px 12px;font-weight:600;font-size:.84rem}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--r)}
.gallery::-webkit-scrollbar{display:none}
.gallery img{flex:0 0 100%;width:100%;aspect-ratio:16/11;max-height:280px;object-fit:cover;border-radius:var(--r);scroll-snap-align:start;background:var(--soft)}
.sheet.mid .gallery img{max-height:190px}
.dots{display:flex;gap:5px;justify-content:center;margin-top:8px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:all var(--d-appear) var(--ease-appear)}
.dots i.on{width:16px;background:var(--ash)}
.caption{font-size:.7rem;color:var(--muted);margin:6px 2px 0;text-align:center}
.caption a{color:inherit}
.dt h2{font-size:1.6rem;font-weight:700;margin:14px 0 0;line-height:1.15;letter-spacing:-.03em;text-wrap:balance}
.dt .vn{color:var(--muted);margin:3px 0 0;font-size:.9rem}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.fact{background:var(--surface);border-radius:12px;padding:7px 11px;font-size:.84rem;display:flex;align-items:center;gap:6px}
.fact b{font-weight:700}
.fact svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fact.route{background:var(--primary);color:var(--on-primary)}
.fact.best{background:var(--accent-soft)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:2px 0 18px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:11px 4px;text-decoration:none;color:var(--ink);font-size:.76rem;font-weight:700;text-align:center;transition:transform var(--d-ui) var(--ease-out),background var(--d-ui)}
.act svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.act.on{background:var(--tag);border-color:var(--olive)}
.dt p{margin:0 0 10px;max-width:65ch}
.dt h5{margin:18px 0 6px;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.todo{margin:0;padding-left:18px}.todo li{margin-bottom:4px}
dl.info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;margin:0;font-size:.9rem}
dl.info dt{color:var(--muted)}dl.info dd{margin:0}
.note{font-size:.84rem;color:var(--ink);background:var(--accent-soft);border-radius:16px;padding:11px 13px;margin-top:14px}

/* plan */
.empty{text-align:center;padding:8px 6px 6px}
.empty h3{margin:4px 0;font-size:1.25rem;font-weight:700}
.empty p{color:var(--muted);margin:0 0 16px;font-size:.9rem}
.presets{display:grid;gap:10px}
.preset{display:flex;align-items:center;gap:12px;border:0;background:var(--surface);border-radius:20px;padding:10px;text-align:left}
.preset img{width:64px;height:64px;border-radius:14px;object-fit:cover;flex:none}
.preset b{display:block;font-weight:700}
.preset span{font-size:.8rem;color:var(--muted)}
.planhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.planhead label{font-size:.84rem;color:var(--muted)}
.planhead input[type=time]{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 9px;font-variant-numeric:tabular-nums;font-weight:600}
.sum{font-size:.86rem;color:var(--muted);margin:0 0 12px}
.sum b{color:var(--ink);font-size:1.02rem}
.tl{list-style:none;margin:0;padding:0}
.leg{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.8rem;padding:6px 0 6px 22px;border-left:2px dashed var(--line);margin-left:22px;font-variant-numeric:tabular-nums}
.leg svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stop{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border-radius:20px;padding:10px}
.stop .num{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.05rem;border:0}
.stop h4{margin:0;font-size:.98rem;font-weight:700;line-height:1.25}
.stop .when{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stop .hint{font-size:.76rem;color:var(--copper);margin-top:3px;font-weight:500}
.stop .hint.ok{color:color-mix(in srgb,var(--olive) 60%,var(--ash))}
.ctrl{display:flex;flex-direction:column;gap:3px}
.ctrl button{border:0;background:var(--soft);border-radius:9px;width:30px;height:26px;font-size:.85rem;color:var(--muted)}
.durc{display:inline-flex;align-items:center;gap:4px;margin-top:4px}
.durc button{border:1px solid var(--line);background:var(--raised);border-radius:8px;width:26px;height:24px;font-size:.85rem;line-height:1;padding:0}
.durc span{font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.planbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 14px;font-size:.84rem;font-weight:700;transition:transform var(--d-ui) var(--ease-out)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.danger{color:var(--copper)}

/* infos */
.box{background:var(--surface);border-radius:22px;padding:16px;margin-bottom:10px}
.box h3{margin:0 0 8px;font-size:1.05rem;font-weight:700}
.box ul{margin:0;padding-left:18px}.box li{margin-bottom:4px}
.conv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.conv label{font-size:.74rem;color:var(--muted);display:block}
.conv input{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--raised);font-variant-numeric:tabular-nums;font-size:1rem}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
table.lex{width:100%;border-collapse:collapse;font-size:.9rem}
table.lex td{padding:6px 2px;border-bottom:1px solid var(--line);vertical-align:top}
table.lex td:first-child{font-weight:700}
table.lex td:last-child{color:var(--muted)}
.credits{font-size:.74rem;color:var(--muted);margin-top:12px}
.credits a{color:inherit}

@media (min-width:900px){
  .sheet,.sheet.mid,.sheet.open{left:12px;right:auto;top:calc(max(10px,env(safe-area-inset-top,0px)) + 64px);bottom:12px;width:420px;height:auto;border-radius:var(--r);box-shadow:var(--shadow);transform:none;transition:none}
  .body{padding-bottom:28px!important}
  .sheet:not(.mid):not(.open){bottom:auto;height:auto}
  .sheet:not(.mid):not(.open) .body{display:none}
  .grab{display:none}.head{padding-top:12px}
  .top{right:auto;width:420px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

<body>
<div class="app" id="app">
  <div id="map" role="region" aria-label="Carte de Tam Cốc"></div>
  <div class="top">
    <button class="pill" id="startPill" type="button"><span class="ava"><img id="pillAva" alt=""></span><span class="t"><small>Trajets depuis</small><b id="startName">Village de Tam Cốc</b></span><span style="color:var(--muted)">▾</span></button>
    <button class="fab" id="locate" type="button" aria-label="Me localiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8z"/></svg></button>
  </div>
  <div class="zoom"><button id="zin" type="button" aria-label="Zoomer">+</button><button id="zout" type="button" aria-label="Dézoomer">−</button><button id="zfit" type="button" aria-label="Tout voir" style="font-size:.95rem">⤢</button></div>
  <div class="toast" id="toast" hidden><span id="toastTxt"></span><button id="toastBtn" type="button">OK</button></div>
  <div class="scrim" id="scrim" hidden></div>
  <div class="menu" id="menu" role="dialog" aria-label="Point de départ" hidden>
    <h3>Où es-tu ?</h3>
    <button class="big" id="mLocate" type="button"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8z"/></svg></span><span><b>Ma position GPS</b><span>Position exacte et direction, en direct</span></span></button>
    <button class="big" id="mTap" type="button"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M3 12h18"/></svg></span><span><b>Toucher la carte</b><span>Place-toi toi-même</span></span></button>
    <h3 style="margin-top:12px;font-size:.95rem">Ou pars de</h3>
    <div class="opts" id="opts"></div>
    <p class="msg" id="menuMsg"></p>
  </div>
  <section class="sheet" id="sheet" aria-label="Lieux et programme">
    <button class="grab" id="grab" type="button" aria-label="Agrandir ou réduire"></button>
    <div class="head">
      <div class="headrow">
        <div class="tabs" role="tablist" id="tabs"><span class="ind" id="ind"></span>
          <button role="tab" data-tab="places" aria-selected="true" type="button">Lieux</button>
          <button role="tab" data-tab="plan" aria-selected="false" type="button">Programme<span class="badge" id="planCount" hidden></span></button>
          <button role="tab" data-tab="info" aria-selected="false" type="button">Infos</button>
        </div>
        <button class="close" id="closeBtn" type="button" aria-label="Fermer le panneau"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="modes" id="modes">
        <button type="button" data-mode="walk" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="M10 21l2-6 3 3v3M9 12l2-4 4 2 3 1M11 8l-2 5 3 2"/></svg>À pied</button>
        <button type="button" data-mode="bike" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="6" cy="16" r="4"/><circle cx="18" cy="16" r="4"/><path d="M6 16l4-8h5l3 8M10 8l2 8h2M14 5h3"/></svg>Vélo</button>
        <button type="button" data-mode="car" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 16v-4l2-5h12l2 5v4zM4 16v2M20 16v2"/><circle cx="8" cy="13.5" r=".8"/><circle cx="16" cy="13.5" r=".8"/></svg>Voiture</button>
      </div>
    </div>
    <div class="body" id="body"></div>
  </section>
</div>

 {id:"quai",name:"Quai des barques de Tam Cốc",vn:"Bến thuyền Tam Cốc (Văn Lâm)",cat:"bateau",ll:[20.2163, 105.9334],

  todo:["Balade en barque d'environ 2 h aller-retour","Partir tôt (7 h) pour la lumière et le calme","Regarder les rizières : dorées fin mai–début juin et fin sept.–oct."],
  facts:{"Durée":"≈ 2 h","Horaires":"≈ 7 h – 17 h","Prix":"Billet ≈ 120 000 ₫/adulte + barque ≈ 150 000 ₫ (2 pers.)"},

 {id:"grottes",name:"Les trois grottes de Tam Cốc",vn:"Hang Cả · Hang Hai · Hang Ba",cat:"bateau",ll:[20.2283,105.9262],

  todo:["Les traverser pendant la balade en barque (incluse dans le billet)","Prévoir une lampe frontale pour voir les stalactites","Pause au demi-tour après Hang Ba : des vendeuses proposent boissons et snacks"],

  todo:["Monter au coucher du soleil (prévoir 30–45 min)","Champ de lotus au pied, en fleur juin–juillet","Grotte Hang Múa au pied de l'escalier"],

 {id:"thienhuong",name:"Grotte Thiên Hương",vn:"Động Thiên Hương",cat:"bateau",ll:[20.223, 105.9312],

 {id:"thungnang",name:"Thung Nắng",vn:"Vallée du Soleil",cat:"nature",ll:[20.2242, 105.9058],

 {id:"denvoi",name:"Temple Đền Vôi",vn:"Đền Vôi · Hang Thoong Nắng",cat:"temple",ll:[20.229, 105.9072],desc:"Petit temple au nord de Thung Nắng, à côté de la grotte Thoong Nắng.",todo:["Détour depuis Thung Nắng"],facts:{}},
 {id:"thungnham",name:"Parc aux oiseaux de Thung Nham",vn:"Vườn chim Thung Nham",cat:"nature",ll:[20.2205, 105.8892],

  facts:{"Durée":"2 – 3 h","Prix":"≈ 100 000 – 200 000 ₫ selon la formule (à vérifier)"},tip:"Anti-moustique indispensable à la tombée du jour."},

 {id:"goidai",name:"Temple Gối Đại",vn:"Đền Gối Đại",cat:"temple",ll:[20.2196, 105.8908],desc:"Temple au cœur du parc de Thung Nham, près du quai.",todo:["Pause pendant la visite du parc"],facts:{}},

 {id:"village",name:"Village de Tam Cốc",vn:"Văn Lâm · Đình Các",cat:"pratique",ll:[20.2151, 105.9367],

const planStops=()=>plan.items.filter(x=>x.id).map(x=>byId[x.id]);
function schedule(){let t=parseT(plan.start),cur=me.ll,tot={min:0,m:0};const out=[];
  plan.items.forEach((it,i)=>{if(it.id){const p=byId[it.id],leg=travel(cur,target(p).ll,mode);t+=leg.min;tot.min+=leg.min;tot.m+=leg.m;const arr=t;t+=it.dur;out.push({it,i,p,leg,arr,dep:t});cur=target(p).ll;}
    else{const arr=t;t+=it.dur;out.push({it,i,arr,dep:t});}});
  return{out,end:t,tot};}
function hint(p,arr){if(!p.best)return"";const[a,b,txt]=p.best;if(arr>=a&&arr<=b)return`<div class="hint ok">✓ Bon moment · ${esc(txt.toLowerCase())}</div>`;return`<div class="hint">${esc(txt)} (vers ${hhmm(a)})</div>`;}

  <p class="sum">Fin vers <b>${hhmm(S.end)}</b> · trajets <b>${fmtDur(S.tot.min)}</b> · ${fmtKm(S.tot.m)}</p>
  <ol class="tl">${S.out.map((o,k)=>{const n=S.out.slice(0,k+1).filter(x=>x.p).length;
    const legH=o.p?`<li class="leg">${mIcon(mode)} ${o.leg.approx?"≈ ":""}${fmtDur(o.leg.min)} · ${fmtKm(o.leg.m)}</li>`:"";
    const inner=o.p?`<button class="num" style="background:${col(o.p.cat)}" data-open="${o.p.id}" type="button">${n}</button><div><h4>${esc(o.p.short||o.p.name)}</h4><div class="when">${hhmm(o.arr)} → ${hhmm(o.dep)}</div><div class="durc"><button type="button" data-d="${o.i}" data-v="-15" aria-label="Moins">−</button><span>${fmtDur(o.it.dur)}</span><button type="button" data-d="${o.i}" data-v="15" aria-label="Plus">+</button></div>${hint(o.p,o.arr)}</div>`
      :`<span class="num" style="background:var(--copper)">☕</span><div><h4>${esc(o.it.label||"Pause")}</h4><div class="when">${hhmm(o.arr)} → ${hhmm(o.dep)}</div><div class="durc"><button type="button" data-d="${o.i}" data-v="-15">−</button><span>${fmtDur(o.it.dur)}</span><button type="button" data-d="${o.i}" data-v="15">+</button></div></div>`;
    return legH+`<li class="stop">${inner}<div class="ctrl"><button type="button" data-up="${o.i}" aria-label="Monter" ${o.i===0?"disabled":""}>↑</button><button type="button" data-dn="${o.i}" aria-label="Descendre" ${o.i===plan.items.length-1?"disabled":""}>↓</button><button type="button" data-rm="${o.i}" aria-label="Retirer">✕</button></div></li><li style="height:8px"></li>`;}).join("")}</ol>
  <div class="planbtns"><button class="btn primary" id="optBtn" type="button">Meilleur ordre</button><button class="btn" id="pauseBtn" type="button">＋ Pause repas</button><button class="btn" id="addBtn" type="button">＋ Lieu</button><button class="btn danger" id="clrBtn" type="button">Tout effacer</button></div>
  <p class="note">Durées de visite tirées des avis de voyageurs, trajets calculés sur les vraies routes. Ajuste avec − / +.</p></div>`;

function optimize(){const places=plan.items.filter(x=>x.id),slots=plan.items.map(x=>!!x.id);let cur=me.ll,left=places.slice();
  const late=left.filter(x=>byId[x.id].best&&byId[x.id].best[0]>=15*60),early=left.filter(x=>byId[x.id].best&&byId[x.id].best[1]<=10*60);
  left=left.filter(x=>!late.includes(x)&&!early.includes(x));
  const nn=arr=>{const out=[];arr=arr.slice();while(arr.length){let bi=0,bt=1e9;arr.forEach((x,i)=>{const t=travel(cur,target(byId[x.id]).ll,mode).min;if(t<bt){bt=t;bi=i}});const x=arr.splice(bi,1)[0];out.push(x);cur=target(byId[x.id]).ll;}return out;};
  const ord=nn(early).concat(nn(left)).concat(nn(late));let k=0;plan.items=slots.map((isP,i)=>isP?ord[k++]:plan.items[i]);savePlan();}

placeSheet();setMinZoom();map.fitBounds(AREA,padOpts());drawBase();drawMe();render();$("map").classList.toggle("hide-labels",map.getZoom()<13.75);
try{navigator.permissions&&navigator.permissions.query({name:"geolocation"}).then(r=>{if(r.state==="granted"&&!inEmbed())locate()}).catch(()=>{})}catch(e){}
let rT;addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(()=>{placeSheet();setMinZoom();render(true)},150)});
const redraw=()=>{rgbCache={};routeSig="";drawBase();drawMe();refreshPins();};
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",redraw);new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});}catch(e){}
/* ---------- always fresh: new versions apply on reload / when the home-screen app comes back ---------- */
if(/github\.io$/.test(location.hostname)){
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").then(r=>{r.update();document.addEventListener("visibilitychange",()=>{if(!document.hidden)r.update()})}).catch(()=>{});
  const check=()=>fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(j=>{if(j.v&&j.v!==APP_VERSION)location.reload()}).catch(()=>{});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)check()});setTimeout(check,3000);
}
